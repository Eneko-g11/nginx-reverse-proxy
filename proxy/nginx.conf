# Reverse proxy: recibe TODO el tráfico del puerto 80 y lo reparte entre los servicios.
# Hay dos formas de repartirlo (se pueden combinar):
#   - Por RUTA:      http://localhost/code/        → mira el principio de la URL  (location)
#   - Por SUBDOMINIO: http://code.localhost/       → mira el nombre pedido        (server_name)
#
# Este fichero, tal como viene, publica por ruta:
#   /             → portal: los archivos de proxy/web/
#   /code/        → servicio "code"      (code-server, puerto 8443)
#   /portainer/   → servicio "portainer" (Portainer, puerto 9000)
# Para añadir un servicio, copia uno de los bloques de abajo cambiando la ruta (o el nombre) y el destino.
# Después de cambiar este fichero: docker compose restart proxy

# DNS interno de Docker. Como cada location pone el servicio en una variable ($destino), nginx lo
# busca en cada petición (guardando la respuesta 10 s) en vez de una sola vez al arrancar. Así:
#   - el proxy arranca aunque algún servicio esté parado o mal escrito (esa ruta da 502), y
#   - si un contenedor se recrea (y cambia de IP), el proxy lo encuentra solo.
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSockets: si el navegador pide "Upgrade", se le pasa al servicio (code-server lo necesita)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cabeceras para TODOS los servicios, estén publicados por ruta o por subdominio.
# Están aquí fuera, y no dentro de un server { }, para que las hereden todos los bloques server.
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Prefix $prefijo;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
client_max_body_size 50m;           # tamaño máximo de lo que se sube (formularios, ficheros)

# HTTPS: un solo certificado para todos los nombres (ENIB.local y *.ENIB.local).
# Se genera con el comando de docs/https.md y queda en ./certs, montado en /etc/nginx/certs (docker-compose.yml).
# Está aquí fuera para que lo hereden todos los bloques server que escuchan en 443.
ssl_certificate     /etc/nginx/certs/ENIB.crt;
ssl_certificate_key /etc/nginx/certs/ENIB.key;
ssl_protocols       TLSv1.2 TLSv1.3;

# =====================================================================================
# HTTP → HTTPS: todo lo que llegue por el puerto 80, sea el nombre que sea, se redirige a https.
# (Si publicas el 443 en otro puerto, añádelo: https://$host:8443$request_uri)
# =====================================================================================
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# =====================================================================================
# SERVIDOR PRINCIPAL: atiende localhost (y cualquier nombre que no tenga su propio server).
# Aquí van los servicios publicados POR RUTA.
# =====================================================================================
server {
    listen 443 ssl default_server;       # default_server: recoge los nombres que no encajan en otro server
    server_name enib.local enib.localhost;
    root /usr/share/nginx/html/web;     # el portal: proxy/web/ (montado como volumen)

    set $prefijo "";
    # Duplicati: publica la interfaz web bajo /duplicati/.
    location /duplicati/ {
        set $destino duplicati:8200;
        proxy_pass http://$destino/;
        proxy_redirect / /duplicati/;
    }
    # ↓ Añade aquí los bloques de los servicios nuevos publicados por ruta (Tareas 2, 3 y 4),
    #   antes de la } que cierra este server. Los de subdominio (Tarea 5) van más abajo, fuera.
}

server {
    listen 443 ssl;       # sin default_server: solo puede haber uno por puerto
    server_name intranet.enib.local intranet.enib.localhost;
    root /usr/share/nginx/html/intranet;     # el portal: proxy/web/ (montado como volumen)


    set $prefijo "";
    # ↓ Añade aquí los bloques de los servicios nuevos publicados por ruta (Tareas 2, 3 y 4),
    #   antes de la } que cierra este server. Los de subdominio (Tarea 5) van más abajo, fuera.
}

