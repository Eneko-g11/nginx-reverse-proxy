    <h1>Kontaktua</h1>
    <p>Galderaren bat duzu? Idatzi iezaguzu eta ahalik eta azkarren erantzungo dizugu.</p>

    <form class="formulario" action="#" method="post">
      <label for="nombre">Izena</label>
      <input type="text" id="nombre" name="nombre" placeholder="Zure izena" required>

      <label for="email">Posta elektronikoa</label>
      <input type="email" id="email" name="email" placeholder="zurepostak@adibidea.com" required>

      <label for="telefono">Telefonoa (aukerakoa)</label>
      <input type="tel" id="telefono" name="telefono" placeholder="600 000 000">

      <label for="mensaje">Mezua</label>
      <textarea id="mensaje" name="mensaje" rows="5" placeholder="Kontatu iezaguzu zer behar duzun" required></textarea>

      <label class="privacidad">
        <input type="checkbox" name="privacidad" required>
        Pribatutasun politika irakurri dut eta onartzen dut
      </label>

      <script>
        const nombreInput = document.getElementById('nombre');
        const emailInput = document.getElementById('email');
        const telefonoInput = document.getElementById('telefono');
        const mensajeInput = document.getElementById('mensaje');
      </script>

      <button class="boton" type="submit">Bidali mezua</button>
    </form>
